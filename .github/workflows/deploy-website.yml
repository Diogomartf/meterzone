name: Deploy website

on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Isolate website TypeScript configuration
        # Both Astro and Wrangler walk up to the Expo app tsconfig. Keep it
        # hidden through deployment because CI installs only website packages.
        run: mv ../tsconfig.json ../tsconfig.json.ci-bak

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=meterzone
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore app TypeScript configuration
        if: always()
        run: |
          if [ -f ../tsconfig.json.ci-bak ]; then
            mv ../tsconfig.json.ci-bak ../tsconfig.json
          fi
